name: PBRP build (begonia)

on:
  workflow_dispatch:
    inputs:
      makefile:
        description: 'Lunch target'
        required: false
        default: 'pb_begonia-eng'
      build_target:
        description: 'Make target'
        required: false
        default: 'recoveryimage'
      jobs:
        description: 'Parallel make jobs'
        required: false
        default: '4'
      ccache:
        description: 'Use ccache (true/false)'
        required: false
        default: 'true'
      publish_release:
        description: 'Create a GitHub release with the image'
        type: boolean
        required: false
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  MANIFEST_URL: 'https://github.com/PitchBlackRecoveryProject/manifest_pb.git'
  MANIFEST_BRANCH: 'android-12.1'
  SRC_DIR: 'aosp'
  CCACHE_DIR: '${{ github.workspace }}/.ccache'

jobs:
  build:
    name: Compile PBRP recovery.img
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show parameters
        run: |
          echo "manifest   : $MANIFEST_URL @ $MANIFEST_BRANCH"
          echo "lunch      : ${{ inputs.makefile || 'pb_begonia-eng' }}"
          echo "target     : ${{ inputs.build_target || 'recoveryimage' }}"
          echo "jobs       : ${{ inputs.jobs || '4' }}"
          echo "ccache     : ${{ inputs.ccache || 'true' }}"
          echo "free space before:"
          df -h /

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    "$AGENT_TOOLSDIRECTORY/CodeQL" \
                    "$AGENT_TOOLSDIRECTORY/Python" \
                    /usr/local/share/boost \
                    /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison ccache curl flex git git-lfs gnupg \
            gcc-multilib g++-multilib \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lz4 pngcrush rsync schedtool squashfs-tools unzip \
            xsltproc zip zlib1g-dev openjdk-11-jdk-headless
          java -version 2>&1

      - name: Set JDK 11
        run: |
          if [ -d "$JAVA_HOME_11_X64" ]; then
            echo "JAVA_HOME=$JAVA_HOME_11_X64" >> "$GITHUB_ENV"
            echo "Using preinstalled JDK 11 at $JAVA_HOME_11_X64"
          else
            echo "JDK 11 not preinstalled; relying on openjdk-11-jdk-headless"
          fi
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -version 2>&1

      - name: Add swap (recovery link steps are memory hungry)
        run: |
          echo "=== swap before ==="
          swapon --show || true
          free -h
          sudo timeout 120 swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== swap after ==="
          swapon --show
          free -h

      - name: Install repo launcher
        run: |
          mkdir -p ~/.bin
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> "$GITHUB_PATH"
          repo --version | head -2

      - name: Restore ccache
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-begonia-${{ github.run_id }}
          restore-keys: |
            ccache-begonia-

      - name: ccache configuration
        if: ${{ (inputs.ccache || 'true') == 'true' }}
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache -M 8G
          ccache --zero-stats || true

      - name: repo init
        run: |
          mkdir -p "$SRC_DIR"
          cd "$SRC_DIR"
          repo init \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            --depth=1
          # Device tree + removal of the dead upstream vendor_utils project.
          mkdir -p .repo/local_manifests
          cp "$GITHUB_WORKSPACE/local_manifests/begonia.xml" .repo/local_manifests/
          echo "--- local manifest in effect ---"
          cat .repo/local_manifests/begonia.xml
          echo "--- project count ---"
          repo list | wc -l

      - name: repo sync
        run: |
          cd "$SRC_DIR"
          repo sync \
            -c -j8 \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune
          echo "--- disk after sync ---"
          df -h /
          echo "--- device tree present? ---"
          ls device/xiaomi/begonia

      - name: Trim disk before build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          # Drop .git for the largest prebuilt/toolchain trees: they are not
          # needed to build, and this frees roughly 10 GB.
          du -sh "$SRC_DIR" 2>/dev/null || true
          find "$SRC_DIR/prebuilts" -maxdepth 6 -type d -name .git -prune -exec rm -rf {} + 2>/dev/null || true
          find "$SRC_DIR/.repo/project-objects" -type d -name '*.git' -prune -exec rm -rf {} + 2>/dev/null || true
          df -h /

      - name: Compile
        env:
          USE_CCACHE: ${{ inputs.ccache || 'true' }}
          ALLOW_MISSING_DEPENDENCIES: 'true'
          BUILD_JOBS: ${{ inputs.jobs || '4' }}
          MAKEFILE_NAME: ${{ inputs.makefile || 'pb_begonia-eng' }}
          BUILD_TARGET: ${{ inputs.build_target || 'recoveryimage' }}
        run: |
          cd "$SRC_DIR"
          set -o pipefail
          source build/envsetup.sh
          lunch "$MAKEFILE_NAME"
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 | tee build.log

      - name: Locate and verify output image
        id: image
        run: |
          cd "$SRC_DIR"
          echo "=== candidate images ==="
          find out/target/product -maxdepth 2 \
            \( -name 'recovery*.img' -o -name 'recovery*.zip' \) \
            -type f -exec ls -la {} \;
          IMG=$(find out/target/product -maxdepth 2 -name 'recovery.img' -type f | head -1)
          if [ -z "$IMG" ]; then
            echo "::error::recovery.img was not produced"
            exit 1
          fi
          cp "$IMG" "$GITHUB_WORKSPACE/recovery.img"
          cd "$GITHUB_WORKSPACE"
          echo "=== sha256 / size ==="
          sha256sum recovery.img
          ls -la recovery.img
          echo "=== avb info ==="
          "$SRC_DIR"/out/host/linux-x86/bin/avbtool info_image --image recovery.img || true
          echo "image_path=recovery.img" >> "$GITHUB_OUTPUT"

      - name: ccache stats
        if: always()
        run: ccache -s || true

      - name: Dump build logs on failure
        if: failure()
        run: |
          if [ ! -d "$SRC_DIR" ]; then
            echo "source tree '$SRC_DIR' does not exist; nothing to dump"
            exit 0
          fi
          cd "$SRC_DIR"
          echo "=== out/error.log ==="
          cat out/error.log 2>/dev/null || echo "(none)"
          echo
          echo "=== first failing lines from build.log ==="
          grep -n -i -m 60 -E "error:|Error [0-9]+|No rule to make target|FAILED:" build.log 2>/dev/null || echo "(none)"
          echo
          echo "=== tail of build.log ==="
          tail -n 200 build.log 2>/dev/null || true

      - name: Upload recovery.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: pbrp-begonia-recovery
          path: recovery.img
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            $SRC_DIR/build.log
            $SRC_DIR/out/error.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: ${{ (inputs.publish_release || false) == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHA=$(sha256sum recovery.img | awk '{print $1}')
          TAG="${GITHUB_REF_NAME:-pbrp-begonia-$(date +%Y%m%d%H%M%S)}"
          {
            echo "PBRP recovery for Redmi Note 8 Pro (begonia)"
            echo
            echo "- commit: $GITHUB_SHA"
            echo "- sha256: \`$SHA\`"
            echo "- built by run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > release-notes.md
          gh release create "$TAG" recovery.img --title "PBRP begonia $TAG" \
            --notes-file release-notes.md || \
          gh release upload "$TAG" recovery.img --clobber